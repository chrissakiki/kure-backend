info:
  name: Get Job Openings
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/admin/job-openings"
  params:
    - name: status
      value: ACTIVELY_HIRING
      type: query
      disabled: true
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
