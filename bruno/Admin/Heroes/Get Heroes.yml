info:
  name: Get Heroes
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/admin/heroes"
  params:
    - name: page
      value: HOME
      type: query
      disabled: true
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
