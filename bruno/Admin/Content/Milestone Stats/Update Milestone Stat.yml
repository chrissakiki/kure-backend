info:
  name: Update Milestone Stat
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/admin/content/milestone-stats/{{milestone_stat_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "value": "25K+",
        "label": "SESSIONS DELIVERED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
