info:
  name: Update Offer Card
  type: http
  seq: 12

http:
  method: PUT
  url: "{{base_url}}/admin/content/offer-cards/{{offer_card_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "price": "$65",
        "badge": "MOST POPULAR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
