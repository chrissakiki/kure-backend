opencollection: 1.0.0

info:
  name: Kure API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: base_url
      value: http://localhost:5001/api
    - name: category_id
      value: ""
    - name: faq_id
      value: "9"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
