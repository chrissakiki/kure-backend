services:

  api:
    build: .

    ports:
      - "${PORT}:${PORT}"

    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"
      
    volumes:
      - kure-postgres-data:/var/lib/postgresql/data

volumes:
  kure-postgres-data: